<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Live View">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.json">
<title>Lumix Live View</title>
<style>
  :root { --fg:#f2f2f2; --dim:#8a8a8a; --acc:#ffcc00; --panel:rgba(18,18,18,.88); }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:#000; color:var(--fg);
    font:15px/1.4 -apple-system,system-ui,sans-serif; overflow:hidden; overscroll-behavior:none; }
  #stage { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:#000; }
  video { width:100%; height:100%; object-fit:contain; background:#000; }
  video.mirror { transform:scaleX(-1); }
  video.flip { transform:scaleY(-1); }
  video.mirror.flip { transform:scale(-1,-1); }
  /* Overlays */
  #grid, #cross, #frame { position:absolute; inset:0; pointer-events:none; display:none; }
  #grid.on, #cross.on, #frame.on { display:block; }
  #grid { background:
    linear-gradient(to right, transparent calc(33.333% - .5px), rgba(255,255,255,.55) calc(33.333% - .5px), rgba(255,255,255,.55) calc(33.333% + .5px), transparent calc(33.333% + .5px), transparent calc(66.666% - .5px), rgba(255,255,255,.55) calc(66.666% - .5px), rgba(255,255,255,.55) calc(66.666% + .5px), transparent calc(66.666% + .5px)),
    linear-gradient(to bottom, transparent calc(33.333% - .5px), rgba(255,255,255,.55) calc(33.333% - .5px), rgba(255,255,255,.55) calc(33.333% + .5px), transparent calc(33.333% + .5px), transparent calc(66.666% - .5px), rgba(255,255,255,.55) calc(66.666% - .5px), rgba(255,255,255,.55) calc(66.666% + .5px), transparent calc(66.666% + .5px)); }
  #cross::before, #cross::after { content:""; position:absolute; background:rgba(255,255,255,.7); }
  #cross::before { left:50%; top:calc(50% - 20px); width:1px; height:40px; }
  #cross::after { top:50%; left:calc(50% - 20px); height:1px; width:40px; }
  #frame { border:2px solid rgba(255,204,0,.8); margin:5%; inset:0; }

  /* UI */
  #ui { position:fixed; left:0; right:0; bottom:0; padding:14px 18px calc(14px + env(safe-area-inset-bottom));
    background:var(--panel); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
    transition:transform .25s ease, opacity .25s ease; }
  #ui.hidden { transform:translateY(110%); opacity:0; pointer-events:none; }
  .row { display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:center; }
  .row + .row { margin-top:10px; }
  select, button { font:inherit; color:var(--fg); background:#2a2a2a; border:1px solid #3a3a3a;
    border-radius:10px; padding:9px 14px; min-height:42px; }
  button.on { background:var(--acc); color:#000; border-color:var(--acc); font-weight:600; }
  button.go { background:#fff; color:#000; font-weight:600; }
  #info { position:fixed; top:calc(10px + env(safe-area-inset-top)); left:14px; padding:6px 10px;
    background:var(--panel); border-radius:8px; color:var(--acc); font:600 13px ui-monospace,Menlo,monospace;
    transition:opacity .25s; pointer-events:none; }
  #info.hidden { opacity:0; }
  #msg { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:30px; gap:10px; color:var(--dim); pointer-events:none; }
  #msg h1 { color:var(--fg); font-size:22px; margin:0; }
  #msg p { max-width:520px; margin:0; }
  #msg.hidden { display:none; }
  #hint { font-size:12px; color:var(--dim); text-align:center; margin-top:8px; }
</style>
</head>
<body>
<div id="stage">
  <video id="v" autoplay playsinline muted></video>
  <div id="grid"></div><div id="cross"></div><div id="frame"></div>
</div>

<div id="msg">
  <h1>Lumix Live View</h1>
  <p>Kamera per USB-C an das iPad anschließen, an der Kamera den USB-Modus auf Streaming (UVC) stellen, dann unten auf „Starten“ tippen.</p>
</div>

<div id="info" class="hidden"></div>

<div id="ui">
  <div class="row">
    <select id="dev" aria-label="Kamera"></select>
    <select id="res" aria-label="Auflösung">
      <option value="3840x2160">4K (3840×2160)</option>
      <option value="1920x1080" selected>Full HD (1920×1080)</option>
      <option value="1280x720">HD (1280×720)</option>
      <option value="max">Maximum (was die Kamera hergibt)</option>
    </select>
    <select id="fps" aria-label="Bildrate">
      <option value="60">60 fps</option>
      <option value="30" selected>30 fps</option>
      <option value="25">25 fps</option>
      <option value="24">24 fps</option>
    </select>
    <button id="go" class="go">Starten</button>
  </div>
  <div class="row">
    <button id="bGrid">Drittel-Raster</button>
    <button id="bCross">Fadenkreuz</button>
    <button id="bFrame">Rahmen</button>
    <button id="bMirror">Spiegeln</button>
    <button id="bFlip">Kopfüber</button>
    <button id="bFit">Füllen</button>
    <button id="bFull">Vollbild</button>
  </div>
  <div id="hint">Tippe aufs Bild, um die Leiste ein-/auszublenden.</div>
</div>

<script>
const $ = id => document.getElementById(id);
const v = $('v'), ui = $('ui'), info = $('info'), msg = $('msg');
let stream = null, wake = null, infoTimer = null;

// ---------- Geräte ----------
async function listDevices() {
  const devs = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'videoinput');
  const sel = $('dev'), keep = sel.value;
  sel.innerHTML = '';
  devs.forEach((d, i) => {
    const o = document.createElement('option');
    o.value = d.deviceId;
    o.textContent = d.label || `Kamera ${i + 1}`;
    sel.appendChild(o);
  });
  // Lumix/externe Kamera bevorzugen
  const pref = devs.find(d => /lumix|panasonic|usb|uvc|external|extern/i.test(d.label));
  if (keep && devs.some(d => d.deviceId === keep)) sel.value = keep;
  else if (pref) sel.value = pref.deviceId;
}

async function start() {
  stop();
  const [w, h] = $('res').value === 'max' ? [7680, 4320] : $('res').value.split('x').map(Number);
  const fps = Number($('fps').value);
  const devId = $('dev').value;
  const video = {
    width: { ideal: w }, height: { ideal: h }, frameRate: { ideal: fps }
  };
  if (devId) video.deviceId = { exact: devId };
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video, audio: false });
  } catch (e) {
    showError(e); return;
  }
  v.srcObject = stream;
  await v.play().catch(()=>{});
  msg.classList.add('hidden');
  await listDevices();               // Labels gibt es erst nach Berechtigung
  if (devId) $('dev').value = devId;
  showInfo();
  v.addEventListener('resize', showInfo);
  requestWake();
  ui.classList.add('hidden');       // direkt aufs Bild
}

function stop() {
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = null; v.srcObject = null;
}

function showInfo() {
  if (!stream) return;
  const s = stream.getVideoTracks()[0].getSettings();
  const w = v.videoWidth || s.width, h = v.videoHeight || s.height;
  info.textContent = `${w}×${h} @ ${Math.round(s.frameRate || 0)} fps`;
  info.classList.remove('hidden');
  clearTimeout(infoTimer);
  infoTimer = setTimeout(() => info.classList.add('hidden'), 4000);
}

function showError(e) {
  let t = 'Kamera konnte nicht gestartet werden.';
  if (e.name === 'NotAllowedError') t = 'Kamerazugriff verweigert. Erlaube ihn in Einstellungen → Safari → Kamera.';
  else if (e.name === 'NotFoundError') t = 'Keine Kamera gefunden. Prüfe das USB-Kabel und den USB-Modus (Streaming/UVC) an der Lumix.';
  else if (e.name === 'OverconstrainedError') t = 'Diese Auflösung/Bildrate geht nicht. Wähle eine kleinere.';
  msg.innerHTML = `<h1>Fehler</h1><p>${t}</p>`;
  msg.classList.remove('hidden');
  ui.classList.remove('hidden');
}

// ---------- Display wach halten ----------
async function requestWake() {
  try { if ('wakeLock' in navigator) wake = await navigator.wakeLock.request('screen'); } catch {}
}
document.addEventListener('visibilitychange', () => { if (!document.hidden && stream) requestWake(); });

// ---------- UI ----------
$('go').onclick = start;
$('res').onchange = $('fps').onchange = () => { if (stream) start(); };
$('dev').onchange = () => { if (stream) start(); };

const toggle = (btn, fn) => btn.onclick = () => btn.classList.toggle('on', fn());
toggle($('bGrid'),   () => $('grid').classList.toggle('on'));
toggle($('bCross'),  () => $('cross').classList.toggle('on'));
toggle($('bFrame'),  () => $('frame').classList.toggle('on'));
toggle($('bMirror'), () => v.classList.toggle('mirror'));
toggle($('bFlip'),   () => v.classList.toggle('flip'));
toggle($('bFit'),    () => { const c = v.style.objectFit === 'cover'; v.style.objectFit = c ? 'contain' : 'cover'; return !c; });
$('bFull').onclick = () => {
  const el = document.documentElement;
  if (document.fullscreenElement || document.webkitFullscreenElement)
    (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  else if (el.requestFullscreen) el.requestFullscreen();
  else if (v.webkitEnterFullscreen) v.webkitEnterFullscreen();
};

$('stage').addEventListener('click', () => { ui.classList.toggle('hidden'); if (stream) showInfo(); });

// Kamera wird ein-/ausgesteckt
if (navigator.mediaDevices) {
  navigator.mediaDevices.addEventListener('devicechange', listDevices);
  listDevices();
} else {
  msg.innerHTML = '<h1>Nicht unterstützt</h1><p>Diese Seite braucht HTTPS und Safari ab iPadOS 17.</p>';
}
</script>
</body>
</html>
